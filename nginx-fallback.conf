# /etc/nginx/conf.d/shelly-proxy.conf
#
# Fallback: Falls FEMS nur Port 80 akzeptiert, können virtuelle IPs
# oder dedizierte Subdomains auf die Proxy-Ports weitergeleitet werden.
#
# Option A: Verschiedene Ports auf localhost → Port 80 auf virtuellen IPs
# Erfordert: ip addr add 192.168.178.201/24 dev eth0 (pro Gerät)
#
# Option B: Einfach nur Port 80 auf einem freien Rechner

# Gerät 1: Klimaanlage Büro → 192.168.178.201:80
server {
    listen 192.168.178.201:80;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}

# Gerät 2: Klimaanlage Wohnzimmer → 192.168.178.202:80
server {
    listen 192.168.178.202:80;
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
    }
}
